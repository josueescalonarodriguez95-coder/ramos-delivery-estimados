<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ramos Delivery</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.imgur.com/81Y7y6U.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #000; -webkit-tap-highlight-color: transparent; }
        .bg-mesh { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: radial-gradient(at 20% 0%, hsla(28,100%,74%,1) 0px, transparent 50%), radial-gradient(at 80% 0%, hsla(189,100%,56%,0.4) 0px, transparent 50%), radial-gradient(at 100% 100%, hsla(355,100%,93%,1) 0px, transparent 50%), radial-gradient(at 0% 100%, hsla(22,100%,77%,1) 0px, transparent 50%); filter: blur(50px); opacity: 0.8; background-color: #f2f2f7; }
        .app-container { max-width: 440px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-top: calc(1.5rem + env(safe-area-inset-top)); padding-bottom: calc(2rem + env(safe-area-inset-bottom)); }
        .glass-light { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.8); border-bottom: none; border-radius: 2.5rem 2.5rem 0 0; }
        .glass-dark { background: rgba(28, 28, 30, 0.85); backdrop-filter: blur(30px); border-top: 1px solid rgba(255, 255, 255, 0.15); border-radius: 0 0 2.5rem 2.5rem; padding-bottom: calc(2rem + env(safe-area-inset-bottom)); }
        .glass-input { background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 1.25rem; font-size: 16px !important; }
        .segmented-btn { border-radius: 99px; transition: all 0.2s; color: #4b5563; font-weight: 500; }
        .segmented-btn.active { background: white; color: #FF7A00; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .tab-content { display: none; } .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="app-container px-4">
        <div class="flex items-center gap-3 mb-6 px-2">
            <img src="https://i.imgur.com/81Y7y6U.png" alt="Logo" class="w-14 h-14 rounded-2xl shadow-lg border-2 border-white/50">
            <div>
                <h1 class="font-extrabold text-2xl text-gray-900">Ramos Delivery</h1>
                <p class="text-sm font-semibold text-gray-600">Cotizador Inteligente</p>
            </div>
        </div>
        <div class="flex-1 flex flex-col shadow-2xl rounded-[2.5rem]">
            <div class="glass-light p-6">
                <div class="flex bg-black/5 p-1 rounded-full mb-6">
                    <button id="btnD" onclick="switchTab('delivery')" class="segmented-btn active flex-1 py-3">Delivery</button>
                    <button id="btnI" onclick="switchTab('install')" class="segmented-btn flex-1 py-3">Instalación</button>
                </div>
                <div id="tabDelivery" class="tab-content active">
                    <label class="block text-sm font-bold mb-2">Destino</label>
                    <select id="deliveryZone" onchange="calculate()" class="w-full glass-input p-4">
                        <option value="miami_corta">Miami (0-5 mi)</option>
                        <option value="miami_larga">Miami (5-15 mi)</option>
                        <option value="sur_fl">Sur de Florida</option>
                    </select>
                </div>
                <div id="tabInstall" class="tab-content">
                    <label class="block text-sm font-bold mb-2">Ubicación</label>
                    <select id="installZone" onchange="calculate()" class="w-full glass-input p-4 mb-4">
                        <option value="casa">En casa del cliente</option>
                        <option value="local">Desplazamiento local</option>
                    </select>
                    <label class="block text-sm font-bold mb-2">Cantidad</label>
                    <div class="flex items-center bg-white/50 p-2 rounded-2xl">
                        <button onclick="changeQty(-1)" class="p-4"><i data-lucide="minus"></i></button>
                        <input id="qty" value="1" class="w-full text-center bg-transparent font-black" readonly>
                        <button onclick="changeQty(1)" class="p-4"><i data-lucide="plus"></i></button>
                    </div>
                </div>
            </div>
            <div class="glass-dark p-6 text-white">
                <div class="text-sm opacity-50 uppercase tracking-widest mb-2">Total Estimado</div>
                <div id="total" class="text-4xl font-black mb-6">$0</div>
                <button onclick="send()" class="w-full py-4 bg-white text-black font-bold rounded-2xl">Enviar a WhatsApp</button>
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons(); let tab = 'delivery';
        function switchTab(t) { tab = t; document.getElementById('tabDelivery').classList.toggle('active', t=='delivery'); document.getElementById('tabInstall').classList.toggle('active', t=='install'); document.getElementById('btnD').classList.toggle('active', t=='delivery'); document.getElementById('btnI').classList.toggle('active', t=='install'); calculate(); }
        function changeQty(n) { let q = document.getElementById('qty'); if(parseInt(q.value)+n > 0) q.value = parseInt(q.value)+n; calculate(); }
        function calculate() { let total = document.getElementById('total'); if(tab == 'delivery') total.innerText = "$100 - $200"; else total.innerText = "$" + (150 * document.getElementById('qty').value); }
        function send() { window.open('https://wa.me/17864262444?text=Hola, quiero cotizar: ' + document.getElementById('total').innerText, '_blank'); }
        calculate();
    </script>
</body>
</html>
