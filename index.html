<style>
body { background-color: #000; -webkit-tap-highlight-color: transparent; }

/* Fondo original cálido y vintage */
.bg-mesh { 
position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; 
background: radial-gradient(at 20% 0%, hsla(28,100%,74%,1) 0px, transparent 50%), 
radial-gradient(at 80% 0%, hsla(189,100%,56%,0.4) 0px, transparent 50%), 
radial-gradient(at 100% 100%, hsla(355,100%,93%,1) 0px, transparent 50%), 
radial-gradient(at 0% 100%, hsla(22,100%,77%,1) 0px, transparent 50%); 
filter: blur(50px); opacity: 0.8; background-color: #f2f2f7; 
}

.app-container { max-width: 440px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding-top: calc(1rem + env(safe-area-inset-top)); padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }

/* Tarjeta superior clara */
.glass-light { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.8); border-bottom: none; border-radius: 2.5rem 2.5rem 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.05); }

/* Tarjeta inferior oscura */
.glass-dark { background: rgba(28, 28, 30, 0.85); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-top: 1px solid rgba(255, 255, 255, 0.15); border-radius: 0 0 2.5rem 2.5rem; box-shadow: 0 15px 40px rgba(0,0,0,0.2); padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)); }

.glass-input { background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 1.25rem; font-size: 16px !important; transition: all 0.2s ease; }
.glass-input:focus { background: #ffffff; border-color: #FF7A00; outline: none; box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.15); }

.segmented-control { background: rgba(0, 0, 0, 0.08); padding: 4px; border-radius: 99px; display: flex; }
.segmented-btn { border-radius: 99px; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); color: #4b5563; font-weight: 500; }
.segmented-btn.active { background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); color: #FF7A00; font-weight: 700; }

.tab-content { display: none; animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
.tab-content.active { display: block; }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.btn-apple { background: #ffffff; color: #000000; transition: transform 0.15s; }
.btn-apple:active { transform: scale(0.96); background: #f3f4f6; }

.custom-checkbox { width: 1.25rem; height: 1.25rem; accent-color: #FF7A00; cursor: pointer; }
</style>
</head>
<body class="text-gray-900">
<div class="bg-mesh"></div>
<div class="app-container px-4 sm:px-0">
<!-- HEADER -->
<div class="flex items-center gap-4 mb-6 px-2 mt-2">
<div class="w-16 h-16 flex-shrink-0 bg-white p-1 rounded-2xl shadow-md border border-gray-100 flex items-center justify-center">

</div>

<div class="flex flex-col shadow-2xl rounded-[2.5rem]">
<div class="glass-light p-6 pb-6">
<!-- SELECTOR DE TRABAJADOR -->
<div class="mb-6">
<label class="block text-sm font-bold text-gray-800 mb-2 ml-1">👤 Atendido por (Especialista)</label>
<div class="relative">
<select id="workerName" class="w-full glass-input text-gray-900 p-4 appearance-none cursor-pointer pr-10 font-bold border-orange-200">

<!-- TRES PESTAÑAS AHORA -->

<optgroup label="Local (Miami)">

<option value="miami_larga">Delivery local (5–15 mi)</option>

<option value="centro_fl">Centro de Florida (Orlando, Tampa...)</option>

</optgroup>

<option value="sureste_eeuu">Sureste de EE.UU. (Georgia, Carolinas...)</option>

</div>

</div>

<div>
<label class="block text-sm font-bold text-gray-800 mb-2 ml-1">💰 Precio acordado ($)</label>
<div class="relative">
<span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-600 font-bold">$</span>

</div>

<!-- TAB INSTALL -->
<div id="tabInstall" class="tab-content space-y-4">

<div class="relative">
<select id="installZone" class="w-full glass-input text-gray-900 p-4 appearance-none cursor-pointer pr-10" onchange="calculate()">
<optgroup label="Miami">
<option value="miami_sitio">Casa del cliente</option>
<option value="miami_local">Local (Requiere desplazamiento a la casa)</option>
</optgroup>
<optgroup label="Fuera de Miami">
<option value="fuera_miami">Cualquier zona (Broward, Palm Beach...)</option>
</optgroup>
</select>
<i data-lucide="chevron-down" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none w-5 h-5"></i>
</div>
</div>

<div>
<label class="block text-sm font-bold text-gray-800 mb-2 ml-1">2. Obras a instalar (Cantidades)</label>
<div class="grid grid-cols-3 gap-2">
<div class="glass-input p-2 text-center">
<span class="block text-[11px] font-bold text-gray-600 mb-1">Pequeños</span>
<input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" spellcheck="false" id="qtySmall" value="0" oninput="calculate()" class="w-full text-center font-black bg-transparent border-none outline-none text-gray-900 text-lg">
</div>
<div class="glass-input p-2 text-center">
<span class="block text-[11px] font-bold text-gray-600 mb-1">Medianos</span>
<input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" spellcheck="false" id="qtyMedium" value="0" oninput="calculate()" class="w-full text-center font-black bg-transparent border-none outline-none text-gray-900 text-lg">
</div>
<div class="glass-input p-2 text-center">
<span class="block text-[11px] font-bold text-gray-600 mb-1">Grandes</span>
<input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" spellcheck="false" id="qtyLarge" value="0" oninput="calculate()" class="w-full text-center font-black bg-transparent border-none outline-none text-gray-900 text-lg">
</div>
</div>
</div>
</div>

<!-- CASILLA DE DESCUENTO -->
<div class="mt-5 pt-5 border-t border-gray-200/60">
<label class="flex items-center gap-3 cursor-pointer">
<input type="checkbox" id="discountCheck" onchange="calculate()" class="custom-checkbox">
<span class="text-sm font-bold text-gray-800 flex items-center gap-1.5">
<i data-lucide="tag" class="w-4 h-4 text-orange-600"></i> Aplicar 10% de descuento
</span>
</label>
</div>

</div>

<div class="glass-dark p-6 relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-24 bg-gradient-to-b from-white/10 to-transparent pointer-events-none"></div>

<div class="relative z-10">
<h3 class="text-xs font-bold uppercase tracking-widest text-white/50 mb-3 flex items-center gap-2">
<i data-lucide="receipt" class="w-4 h-4"></i> Resumen del Estimado
</h3>

<div class="space-y-2 mb-4">

</div>

<!-- Desglose dinámico de cantidades (Instalación) -->
<div id="rowSmall" class="hidden justify-between items-end border-b border-white/10 pb-2">
<span class="text-xs text-white/70 font-medium flex items-center gap-1.5"><i data-lucide="frame" class="w-3.5 h-3.5 opacity-70"></i> Obras Pequeñas</span>

<div class="mb-5">
<span class="block text-xs text-white/70 mb-1 font-medium">Total Estimado</span>

A cotizar
</div>
</div>

<button onclick="contactarWhatsApp()" class="btn-apple w-full py-3.5 rounded-[1.25rem] font-bold text-base flex items-center justify-center gap-2 shadow-[0_8px_20px_rgba(0,0,0,0.2)] relative z-10">
<i data-lucide="message-circle" class="w-5 h-5 text-[#34C759]"></i> 
Enviar a WhatsApp
</button>

<script>
lucide.createIcons();
let currentTab = 'delivery';

const dbDelivery = {
miami_corta: { type: 'range', label: 'Miami (0-5 mi)', min: 80, max: 250 },
miami_larga: { type: 'range', label: 'Miami (5-15 mi)', min: 80, max: 350 },
miami_express: { type: 'range', label: 'Miami Exprés', min: 250, max: 500 },
miami_programada: { type: 'tbd', label: 'Miami Programada' },
sur_fl: { type: 'range', label: 'Sur de FL', min: 500, max: 900 },
centro_fl: { type: 'range', label: 'Centro de FL', min: 950, max: 1200 },
norte_fl: { type: 'range', label: 'Norte de FL', min: 2500, max: 5000 },
sureste_eeuu: { type: 'range', label: 'Sureste EE.UU.', min: 3500, max: 6000 },
nacional: { type: 'tbd', label: 'Nacional' }
};

const dbInstall = {
miami_sitio: { 
label: 'Casa del cliente', 
prices: { pequeno: 50, mediano: 75, grande: 100 }
},
miami_local: { 
label: 'Local (Desplazamiento)',
primera: { pequeno: 150, mediano: 180, grande: 220 },
extra: { pequeno: 50, mediano: 75, grande: 100 }
},
fuera_miami: { 
label: 'Fuera de Miami',
prices: { pequeno: 250, mediano: 300, grande: 350 }
}
};

function formatCurrency(amount) {
return "$" + amount.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function switchTab(tabId) {
currentTab = tabId;
const tabDel = document.getElementById('tabDelivery');
const tabInst = document.getElementById('tabInstall');

const btnDel = document.getElementById('btnTabDelivery');
const btnInst = document.getElementById('btnTabInstall');
const btnBoth = document.getElementById('btnTabBoth');

btnDel.classList.remove('active');
btnInst.classList.remove('active');
btnBoth.classList.remove('active');

tabDel.classList.remove('active');
tabInst.classList.remove('active');

// Remover división estética
tabInst.classList.remove('mt-6', 'pt-6', 'border-t', 'border-gray-300/40');

if (tabId === 'delivery') {
tabDel.classList.add('active');
btnDel.classList.add('active');
} else if (tabId === 'install') {
tabInst.classList.add('active');
btnInst.classList.add('active');
} else if (tabId === 'both') {
tabDel.classList.add('active');
tabInst.classList.add('active');
btnBoth.classList.add('active');
// Agregar una línea divisoria sutil para separar Delivery de Instalación
tabInst.classList.add('mt-6', 'pt-6', 'border-t', 'border-gray-300/40');
}
calculate();
}

function calculate() {
const lbl1 = document.getElementById('summaryLabel1');
const val1 = document.getElementById('summaryValue1');
const lbl2 = document.getElementById('summaryLabel2');
const val2 = document.getElementById('summaryValue2');
const total = document.getElementById('totalPrice');

const rowSmall = document.getElementById('rowSmall');
const rowMedium = document.getElementById('rowMedium');
const rowLarge = document.getElementById('rowLarge');
const valSmall = document.getElementById('valSmall');
const valMedium = document.getElementById('valMedium');
const valLarge = document.getElementById('valLarge');

const suggestedRange = document.getElementById('deliverySuggestedRange');
const manualDeliveryPrice = document.getElementById('manualDeliveryPrice').value;

const rowDiscount = document.getElementById('rowDiscount');
const applyDiscount = document.getElementById('discountCheck').checked;

if (applyDiscount) {
rowDiscount.classList.remove('hidden');
rowDiscount.classList.add('flex');
} else {
rowDiscount.classList.add('hidden');
rowDiscount.classList.remove('flex');
}

let deliveryTotal = 0;
let installTotal = 0;
let totalQty = 0;

// 1. EVALUAR DELIVERY
if (currentTab === 'delivery' || currentTab === 'both') {
const zoneKey = document.getElementById('deliveryZone').value;
const data = dbDelivery[zoneKey];

if (data.type === 'tbd') {
suggestedRange.innerText = "Rango sugerido: Precio a cotizar / Variable";
} else {
suggestedRange.innerText = `Rango sugerido: ${formatCurrency(data.min)} - ${formatCurrency(data.max)}`;
}
suggestedRange.classList.remove('hidden');

deliveryTotal = parseFloat(manualDeliveryPrice) || 0;
} else {
suggestedRange.classList.add('hidden');
}

// 2. EVALUAR INSTALACIÓN
if (currentTab === 'install' || currentTab === 'both') {
const zoneKeyInst = document.getElementById('installZone').value;
const dataInst = dbInstall[zoneKeyInst];

const qS = parseInt(document.getElementById('qtySmall').value) || 0;
const qM = parseInt(document.getElementById('qtyMedium').value) || 0;
const qG = parseInt(document.getElementById('qtyLarge').value) || 0;
totalQty = qS + qM + qG;

// Desglose de obras
if (qS > 0) { valSmall.innerText = qS; rowSmall.classList.remove('hidden'); rowSmall.classList.add('flex'); } 
else { rowSmall.classList.add('hidden'); rowSmall.classList.remove('flex'); }
if (qM > 0) { valMedium.innerText = qM; rowMedium.classList.remove('hidden'); rowMedium.classList.add('flex'); } 
else { rowMedium.classList.add('hidden'); rowMedium.classList.remove('flex'); }
if (qG > 0) { valLarge.innerText = qG; rowLarge.classList.remove('hidden'); rowLarge.classList.add('flex'); } 
else { rowLarge.classList.add('hidden'); rowLarge.classList.remove('flex'); }

// Suma matemática
if (totalQty > 0) {
if (zoneKeyInst === 'miami_sitio' || zoneKeyInst === 'fuera_miami') {
installTotal = (qS * dataInst.prices.pequeno) + (qM * dataInst.prices.mediano) + (qG * dataInst.prices.grande);
} 
else if (zoneKeyInst === 'miami_local') {
let countS = qS, countM = qM, countG = qG;
if (countG > 0) {
installTotal += dataInst.primera.grande + ((countG - 1) * dataInst.extra.grande);
installTotal += countM * dataInst.extra.mediano + countS * dataInst.extra.pequeno;
} else if (countM > 0) {
installTotal += dataInst.primera.mediano + ((countM - 1) * dataInst.extra.mediano);
installTotal += countS * dataInst.extra.pequeno;
} else if (countS > 0) {
installTotal += dataInst.primera.pequeno + ((countS - 1) * dataInst.extra.pequeno);
}
}
}
} else {
// Ocultar si solo estamos en delivery
rowSmall.classList.add('hidden'); rowSmall.classList.remove('flex');
rowMedium.classList.add('hidden'); rowMedium.classList.remove('flex');
rowLarge.classList.add('hidden'); rowLarge.classList.remove('flex');
}

// 3. ACTUALIZAR RESUMEN (UI) Y TOTALES
if (currentTab === 'delivery') {
lbl1.innerText = "Servicio";
val1.innerText = "Delivery";
lbl2.innerText = "Destino";
val2.innerText = dbDelivery[document.getElementById('deliveryZone').value].label;

let finalD = deliveryTotal;
if (finalD === 0) { 
total.innerText = "A cotizar"; total.style.fontSize = "2rem"; 
} else {
if (applyDiscount) finalD *= 0.9;
total.innerText = formatCurrency(finalD); total.style.fontSize = "2.2rem";
}
} 
else if (currentTab === 'install') {
lbl1.innerText = "Servicio";
val1.innerText = totalQty > 0 ? `Instalación (${totalQty})` : "Instalación";
lbl2.innerText = "Ubicación";
val2.innerText = dbInstall[document.getElementById('installZone').value].label;

let finalI = installTotal;
if (totalQty === 0) { 
total.innerText = "$0"; total.style.fontSize = "2rem"; 
} else {
if (applyDiscount && finalI > 0) finalI *= 0.9;
total.innerText = formatCurrency(finalI); total.style.fontSize = "2.2rem";
}
}
else if (currentTab === 'both') {
lbl1.innerText = "Servicio";
val1.innerText = "Delivery + Instalación";
lbl2.innerText = "Detalle";
val2.innerText = "Servicio Combinado";

let finalBoth = deliveryTotal + installTotal;
if (finalBoth === 0 && deliveryTotal === 0 && installTotal === 0) {
total.innerText = "A cotizar"; total.style.fontSize = "2rem";
} else {
if (applyDiscount && finalBoth > 0) finalBoth *= 0.9;
total.innerText = formatCurrency(finalBoth); total.style.fontSize = "2.2rem";
}
}
}

function contactarWhatsApp() {
const numeroWhatsApp = "17864262444";
const total = document.getElementById('totalPrice').innerText;
const workerSelect = document.getElementById('workerName').value;
const workerNameFormat = workerSelect !== "No especificado" ? workerSelect : "No especificado";
const applyDiscount = document.getElementById('discountCheck').checked;
const discountText = applyDiscount ? "\n🏷️ *Promoción:* 10% de descuento APLICADO" : "";

let mensaje = "";

if (currentTab === 'delivery') {
const manualDeliveryPrice = document.getElementById('manualDeliveryPrice').value;
if (!manualDeliveryPrice || isNaN(manualDeliveryPrice) || manualDeliveryPrice == 0) {
alert("Por favor, ingresa el 'Precio acordado' para el Delivery antes de enviar.");
return;
}
const sel = document.getElementById('deliveryZone');
const destino = sel.options[sel.selectedIndex].text;
mensaje = `Hola Ramos Delivery! 🚚\n\n👤 *Cotizado por:* ${workerNameFormat}\n📦 *Servicio:* Solo Delivery\n📍 *Destino:* ${destino}${discountText}\n💰 *Estimado:* ${total}`;
} 
else if (currentTab === 'install') {
const sel = document.getElementById('installZone');
const zona = sel.options[sel.selectedIndex].text;

const qS = parseInt(document.getElementById('qtySmall').value) || 0;
const qM = parseInt(document.getElementById('qtyMedium').value) || 0;
const qG = parseInt(document.getElementById('qtyLarge').value) || 0;

let sizesText = [];
if(qG > 0) sizesText.push(`${qG} Grande(s)`);
if(qM > 0) sizesText.push(`${qM} Mediano(s)`);
if(qS > 0) sizesText.push(`${qS} Pequeño(s)`);
let obrasInfo = sizesText.length > 0 ? sizesText.join(", ") : "Ninguna";

if (sizesText.length === 0) {
alert("Por favor, ingresa al menos una obra para cotizar la instalación.");
return;
}

mensaje = `Hola Ramos Delivery! 🖼️\n\n👤 *Cotizado por:* ${workerNameFormat}\n📦 *Servicio:* Solo Instalación\n📍 *Ubicación:* ${zona}\n🖼️ *Obras a Instalar:* ${obrasInfo}${discountText}\n💰 *Estimado:* ${total}`;
}
else if (currentTab === 'both') {
// Validación combinada
const manualDeliveryPrice = document.getElementById('manualDeliveryPrice').value;
if (!manualDeliveryPrice || isNaN(manualDeliveryPrice) || manualDeliveryPrice == 0) {
alert("Por favor, ingresa el 'Precio acordado' para el Delivery antes de enviar.");
return;
}

const qS = parseInt(document.getElementById('qtySmall').value) || 0;
const qM = parseInt(document.getElementById('qtyMedium').value) || 0;
const qG = parseInt(document.getElementById('qtyLarge').value) || 0;
let sizesText = [];
if(qG > 0) sizesText.push(`${qG} Grande(s)`);
if(qM > 0) sizesText.push(`${qM} Mediano(s)`);
if(qS > 0) sizesText.push(`${qS} Pequeño(s)`);
let obrasInfo = sizesText.length > 0 ? sizesText.join(", ") : "Ninguna";

if (sizesText.length === 0) {
alert("Por favor, ingresa al menos una obra para cotizar la instalación.");
return;
}

const selDel = document.getElementById('deliveryZone');
const destinoDel = selDel.options[selDel.selectedIndex].text;

const selInst = document.getElementById('installZone');
const zonaInst = selInst.options[selInst.selectedIndex].text;

mensaje = `Hola Ramos Delivery! 🚚🖼️\n\n👤 *Cotizado por:* ${workerNameFormat}\n📦 *Servicio:* Delivery + Instalación (Completo)\n\n📍 *Destino del Delivery:* ${destinoDel}\n📍 *Ubicación de Instalación:* ${zonaInst}\n🖼️ *Obras a Instalar:* ${obrasInfo}${discountText}\n\n💰 *Total Estimado:* ${total}`;
}

const url = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensaje)}`;
window.open(url, '_blank');
}

calculate();
</script>
</body>
</html>
