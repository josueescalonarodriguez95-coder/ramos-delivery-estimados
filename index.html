<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ramos Delivery</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.imgur.com/0WfdGVr.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #000; -webkit-tap-highlight-color: transparent; }
        .bg-mesh { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: radial-gradient(at 20% 0%, hsla(28,100%,74%,1) 0px, transparent 50%), radial-gradient(at 80% 0%, hsla(189,100%,56%,0.4) 0px, transparent 50%), radial-gradient(at 100% 100%, hsla(355,100%,93%,1) 0px, transparent 50%), radial-gradient(at 0% 100%, hsla(22,100%,77%,1) 0px, transparent 50%); filter: blur(50px); opacity: 0.8; background-color: #f2f2f7; }
        .app-container { max-width: 440px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-top: calc(1.5rem + env(safe-area-inset-top)); padding-bottom: calc(2rem + env(safe-area-inset-bottom)); }
        .glass-light { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 2.5rem 2.5rem 0 0; }
        .glass-dark { background: rgba(28, 28, 30, 0.85); backdrop-filter: blur(30px); border-radius: 0 0 2.5rem 2.5rem; }
        .glass-input { background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 1.25rem; font-size: 16px !important; }
        .segmented-btn { border-radius: 99px; transition: all 0.2s; color: #4b5563; font-weight: 500; }
        .segmented-btn.active { background: white; color: #FF7A00; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .tab-content { display: none; } .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="app-container px-4">
        <div class="flex items-center gap-4 mb-8 px-2 mt-2">
            <div class="w-16 h-16 flex-shrink-0 bg-white p-1 rounded-2xl shadow-md border border-gray-100 flex items-center justify-center">
                <img src="https://i.imgur.com/0WfdGVr.png" class="w-full h-full object-contain rounded-xl">
            </div>
            <div>
                <h1 class="font-black text-2xl text-gray-900 leading-tight">Ramos Delivery</h1>
                <p class="text-xs font-bold text-orange-600 uppercase tracking-widest mt-0.5">Enterprise</p>
            </div>
        </div>

        <div class="flex-1 flex flex-col shadow-2xl rounded-[2.5rem]">
            <div class="glass-light p-6">
                <div class="flex bg-black/5 p-1 rounded-full mb-6">
                    <button id="btnD" onclick="switchTab('delivery')" class="segmented-btn active flex-1 py-3">Delivery</button>
                    <button id="btnI" onclick="switchTab('install')" class="segmented-btn flex-1 py-3">Instalación</button>
                </div>
                
                <div id="tabDelivery" class="tab-content active">
                    <label class="block text-sm font-bold mb-2">Destino</label>
                    <select id="deliveryZone" onchange="calculate()" class="w-full glass-input p-4 mb-4">
                        <option value="miami_corta">Miami (0-5 mi)</option>
                        <option value="miami_larga">Miami (5-15 mi)</option>
                        <option value="sur_fl">Sur de Florida</option>
                    </select>
                </div>

                <div id="tabInstall" class="tab-content space-y-4">
                    <label class="block text-sm font-bold mb-2">Ubicación</label>
                    <select id="installZone" onchange="calculate()" class="w-full glass-input p-4 mb-4">
                        <option value="miami_sitio">En casa del cliente</option>
                        <option value="miami_local">Local (Desplazamiento)</option>
                        <option value="fuera_miami">Fuera de Miami</option>
                    </select>
                    
                    <label class="block text-sm font-bold mb-2">Obras (Pequeño / Mediano / Grande)</label>
                    <div class="grid grid-cols-3 gap-2">
                        <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" id="qtySmall" value="0" oninput="calculate()" class="glass-input p-3 text-center font-bold">
                        <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" id="qtyMedium" value="0" oninput="calculate()" class="glass-input p-3 text-center font-bold">
                        <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" id="qtyLarge" value="0" oninput="calculate()" class="glass-input p-3 text-center font-bold">
                    </div>
                </div>
            </div>
            
            <div class="glass-dark p-6 text-white">
                <div class="text-sm opacity-50 uppercase tracking-widest mb-1">Total Estimado</div>
                <div id="totalPrice" class="text-4xl font-black mb-6">$0</div>
                <button onclick="send()" class="w-full py-4 bg-white text-black font-bold rounded-2xl">Enviar a WhatsApp</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let tab = 'delivery';
        function switchTab(t) { 
            tab = t; 
            document.getElementById('tabDelivery').classList.toggle('active', t=='delivery'); 
            document.getElementById('tabInstall').classList.toggle('active', t=='install'); 
            document.getElementById('btnD').classList.toggle('active', t=='delivery'); 
            document.getElementById('btnI').classList.toggle('active', t=='install'); 
            calculate(); 
        }
        function calculate() {
            let total = document.getElementById('totalPrice');
            if(tab == 'delivery') {
                total.innerText = "$100 - $200";
            } else {
                let qS = parseInt(document.getElementById('qtySmall').value)||0;
                let qM = parseInt(document.getElementById('qtyMedium').value)||0;
                let qG = parseInt(document.getElementById('qtyLarge').value)||0;
                let val = (qS*50) + (qM*75) + (qG*100);
                total.innerText = "$" + val;
            }
        }
        function send() { 
            window.open('https://wa.me/17864262444?text=Hola, quiero cotizar: ' + document.getElementById('totalPrice').innerText, '_blank'); 
        }
    </script>
</body>
</html>
