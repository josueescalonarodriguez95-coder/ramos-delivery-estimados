<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ramos Delivery</title>
    
    <!-- Configuración para iPhone (PWA Mode) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ramos Delivery">
    <link rel="apple-touch-icon" href="https://i.imgur.com/0WfdGVr.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', 'Roboto', 'Helvetica', 'sans-serif'],
                    },
                    colors: {
                        primary: '#FF7A00',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000; -webkit-tap-highlight-color: transparent; }
        .bg-mesh { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: radial-gradient(at 20% 0%, hsla(28,100%,74%,1) 0px, transparent 50%), radial-gradient(at 80% 0%, hsla(189,100%,56%,0.4) 0px, transparent 50%), radial-gradient(at 100% 100%, hsla(355,100%,93%,1) 0px, transparent 50%), radial-gradient(at 0% 100%, hsla(22,100%,77%,1) 0px, transparent 50%); filter: blur(50px); opacity: 0.8; background-color: #f2f2f7; }
        .app-container { max-width: 440px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-top: calc(1.5rem + env(safe-area-inset-top)); padding-bottom: calc(2rem + env(safe-area-inset-bottom)); }
        .glass-light { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.8); border-bottom: none; border-radius: 2.5rem 2.5rem 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.05); }
        .glass-dark { background: rgba(28, 28, 30, 0.85); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-top: 1px solid rgba(255, 255, 255, 0.15); border-radius: 0 0 2.5rem 2.5rem; box-shadow: 0 15px 40px rgba(0,0,0,0.2); padding-bottom: calc(2rem + env(safe-area-inset-bottom)); }
        .glass-input { background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 1.25rem; font-size: 16px !important; transition: all 0.2s ease; }
        .glass-input:focus { background: #ffffff; border-color: #FF7A00; outline: none; box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.15); }
        .segmented-control { background: rgba(0, 0, 0, 0.08); padding: 4px; border-radius: 99px; display: flex; }
        .segmented-btn { border-radius: 99px; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); color: #4b5563; font-weight: 500; }
        .segmented-btn.active { background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); color: #FF7A00; font-weight: 700; }
        .tab-content { display: none; animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .tab-content.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .btn-apple { background: #ffffff; color: #000000; transition: transform 0.15s; }
        .btn-apple:active { transform: scale(0.96); background: #f3f4f6; }
    </style>
</head>
<body class="text-gray-900">

    <div class="bg-mesh"></div>

    <div class="app-container px-4 sm:px-0">
        <!-- HEADER -->
        <div class="flex items-center gap-4 mb-8 px-2 mt-2">
            <div class="w-16 h-16 flex-shrink-0 bg-white p-1 rounded-2xl shadow-md border border-gray-100 flex items-center justify-center">
                <img src="https://i.imgur.com/0WfdGVr.png" alt="Logotipo Ramos Delivery" class="w-full h-full object-contain rounded-xl">
            </div>
            <div class="flex flex-col justify-center">
                <h1 class="font-black text-2xl tracking-tighter text-gray-900 leading-tight">Ramos Delivery</h1>
                <p class="text-xs font-bold text-orange-600 uppercase tracking-widest mt-0.5">Enterprise</p>
            </div>
        </div>

        <div class="flex-1 flex flex-col shadow-2xl rounded-[2.5rem]">
            <div class="glass-light p-6 pb-8">
                <!-- PESTAÑAS -->
                <div class="segmented-control mb-8">
                    <button id="btnTabDelivery" onclick="switchTab('delivery')" class="segmented-btn active flex-1 py-3 text-sm flex justify-center items-center gap-2">
                        <i data-lucide="truck" class="w-4 h-4"></i> Solo Delivery
                    </button>
                    <button id="btnTabInstall" onclick="switchTab('install')" class="segmented-btn flex-1 py-3 text-sm flex justify-center items-center gap-2">
                        <i data-lucide="frame" class="w-4 h-4"></i> Instalación
                    </button>
                </div>

                <!-- TAB DELIVERY -->
                <div id="tabDelivery" class="tab-content active space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-800 mb-2 ml-1">📍 Destino del envío</label>
                        <div class="relative">
                            <select id="deliveryZone" class="w-full glass-input text-gray-900 p-4 appearance-none cursor-pointer pr-10" onchange="calculate()">
                                <optgroup label="Local (Miami)">
                                    <option value="miami_corta">Delivery local (0–5 mi)</option>
                                    <option value="miami_larga">Delivery local (5–15 mi)</option>
                                    <option value="miami_express">Delivery exprés (< 2 horas)</option>
                                    <option value="miami_programada">Entrega programada</option>
                                </optgroup>
                                <optgroup label="Florida (Fuera de Miami)">
                                    <option value="sur_fl">Sur de Florida (Broward, Palm Beach...)</option>
                                    <option value="centro_fl">Centro de Florida (Orlando, Tampa...)</option>
                                    <option value="norte_fl">Norte de Florida (Jacksonville...)</option>
                                </optgroup>
                                <optgroup label="Fuera de Florida">
                                    <option value="sureste_eeuu">Sureste de EE.UU. (Georgia, Carolinas...)</option>
                                    <option value="nacional">Nacional (Cualquier otro estado)</option>
                                </optgroup>
                            </select>
                            <i data-lucide="chevron-down" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none w-5 h-5"></i>
                        </div>
                    </div>
                </div>

                <!-- TAB INSTALL (NUEVO DISEÑO MIXTO) -->
                <div id="tabInstall" class="tab-content space-y-7">
                    <div>
                        <label class="block text-sm font-bold text-gray-800 mb-2 ml-1">1. Ubicación del trabajo</label>
                        <div class="relative">
                            <select id="installZone" class="w-full glass-input text-gray-900 p-4 appearance-none cursor-pointer pr-10" onchange="calculate()">
                                <optgroup label="Miami">
                                    <option value="miami_sitio">En casa del cliente (Ya estoy ahí)</option>
                                    <option value="miami_local">Local (Requiere desplazamiento a la casa)</option>
                                </optgroup>
                                <optgroup label="Fuera de Miami">
                                    <option value="fuera_miami">Cualquier zona (Broward, Palm Beach...)</option>
                                </optgroup>
                            </select>
                            <i data-lucide="chevron-down" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none w-5 h-5"></i>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-800 mb-3 ml-1">2. Obras a instalar (Cantidades)</label>
                        <div class="space-y-3">
                            
                            <!-- Pequeños -->
                            <div class="flex items-center justify-between glass-input p-2 pr-3">
                                <div class="flex items-center gap-3 pl-2">
                                    <i data-lucide="frame" class="w-5 h-5 text-gray-500"></i>
                                    <span class="block font-bold text-sm text-gray-800">Pequeños</span>
                                </div>
                                <div class="flex items-center bg-white/60 rounded-xl border border-white">
                                    <button type="button" onclick="changeSizeQty('qtySmall', -1)" class="w-10 h-10 flex items-center justify-center text-gray-800 active:scale-95"><i data-lucide="minus" class="w-4 h-4"></i></button>
                                    <input type="number" id="qtySmall" value="1" min="0" class="w-8 text-center font-black bg-transparent border-none outline-none text-gray-900" readonly>
                                    <button type="button" onclick="changeSizeQty('qtySmall', 1)" class="w-10 h-10 flex items-center justify-center text-[#FF7A00] active:scale-95"><i data-lucide="plus" class="w-4 h-4"></i></button>
                                </div>
                            </div>

                            <!-- Medianos -->
                            <div class="flex items-center justify-between glass-input p-2 pr-3">
                                <div class="flex items-center gap-3 pl-2">
                                    <i data-lucide="frame" class="w-6 h-6 text-gray-500"></i>
                                    <span class="block font-bold text-sm text-gray-800">Medianos</span>
                                </div>
                                <div class="flex items-center bg-white/60 rounded-xl border border-white">
                                    <button type="button" onclick="changeSizeQty('qtyMedium', -1)" class="w-10 h-10 flex items-center justify-center text-gray-800 active:scale-95"><i data-lucide="minus" class="w-4 h-4"></i></button>
                                    <input type="number" id="qtyMedium" value="0" min="0" class="w-8 text-center font-black bg-transparent border-none outline-none text-gray-900" readonly>
                                    <button type="button" onclick="changeSizeQty('qtyMedium', 1)" class="w-10 h-10 flex items-center justify-center text-[#FF7A00] active:scale-95"><i data-lucide="plus" class="w-4 h-4"></i></button>
                                </div>
                            </div>

                            <!-- Grandes -->
                            <div class="flex items-center justify-between glass-input p-2 pr-3">
                                <div class="flex items-center gap-3 pl-2">
                                    <i data-lucide="frame" class="w-7 h-7 text-gray-500"></i>
                                    <span class="block font-bold text-sm text-gray-800">Grandes</span>
                                </div>
                                <div class="flex items-center bg-white/60 rounded-xl border border-white">
                                    <button type="button" onclick="changeSizeQty('qtyLarge', -1)" class="w-10 h-10 flex items-center justify-center text-gray-800 active:scale-95"><i data-lucide="minus" class="w-4 h-4"></i></button>
                                    <input type="number" id="qtyLarge" value="0" min="0" class="w-8 text-center font-black bg-transparent border-none outline-none text-gray-900" readonly>
                                    <button type="button" onclick="changeSizeQty('qtyLarge', 1)" class="w-10 h-10 flex items-center justify-center text-[#FF7A00] active:scale-95"><i data-lucide="plus" class="w-4 h-4"></i></button>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <div class="glass-dark p-6 flex flex-col justify-between flex-1 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-24 bg-gradient-to-b from-white/10 to-transparent pointer-events-none"></div>
                
                <div class="relative z-10">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-white/50 mb-5 flex items-center gap-2">
                        <i data-lucide="receipt" class="w-4 h-4"></i> Resumen
                    </h3>
                    
                    <div class="space-y-4 mb-6">
                        <div class="flex justify-between items-end border-b border-white/10 pb-3">
                            <span id="summaryLabel1" class="text-sm text-white/70 font-medium">Servicio</span>
                            <span id="summaryValue1" class="font-bold text-base text-right text-white">Delivery</span>
                        </div>
                        <div class="flex justify-between items-end border-b border-white/10 pb-3">
                            <span id="summaryLabel2" class="text-sm text-white/70 font-medium">Detalle</span>
                            <span id="summaryValue2" class="font-bold text-right text-white/90 text-sm max-w-[180px] truncate">Miami Local</span>
                        </div>
                    </div>

                    <div class="mt-6 mb-8">
                        <span class="block text-sm text-white/70 mb-1 font-medium">Total Estimado</span>
                        <div class="text-[2.5rem] leading-none font-black text-white tracking-tight drop-shadow-md" id="totalPrice">
                            A cotizar
                        </div>
                    </div>
                </div>

                <button onclick="contactarWhatsApp()" class="btn-apple w-full py-[1.125rem] rounded-[1.25rem] font-bold text-[17px] flex items-center justify-center gap-2 shadow-[0_8px_20px_rgba(0,0,0,0.2)] relative z-10">
                    <i data-lucide="message-circle" class="w-6 h-6 text-[#34C759]"></i> 
                    Enviar a WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let currentTab = 'delivery';

        const dbDelivery = {
            miami_corta: { type: 'tbd', label: 'Miami (0-5 mi)' },
            miami_larga: { type: 'tbd', label: 'Miami (5-15 mi)' },
            miami_express: { type: 'tbd', label: 'Miami Exprés' },
            miami_programada: { type: 'tbd', label: 'Miami Programada' },
            sur_fl: { type: 'range', label: 'Sur de FL', min: 500, max: 900 },
            centro_fl: { type: 'range', label: 'Centro de FL', min: 950, max: 1200 },
            norte_fl: { type: 'range', label: 'Norte de FL', min: 2500, max: 5000 },
            sureste_eeuu: { type: 'range', label: 'Sureste EE.UU.', min: 3500, max: 6000 },
            nacional: { type: 'tbd', label: 'Nacional' }
        };

        const dbInstall = {
            miami_sitio: { 
                label: 'En casa del cliente', 
                prices: { pequeno: 50, mediano: 75, grande: 100 }
            },
            miami_local: { 
                label: 'Local (Desplazamiento)',
                primera: { pequeno: 150, mediano: 180, grande: 220 },
                extra: { pequeno: 50, mediano: 75, grande: 100 }
            },
            fuera_miami: { 
                label: 'Fuera de Miami',
                prices: { pequeno: 250, mediano: 300, grande: 350 }
            }
        };

        function formatCurrency(amount) {
            return "$" + amount.toLocaleString('en-US');
        }

        function switchTab(tabId) {
            currentTab = tabId;
            document.getElementById('tabDelivery').classList.remove('active');
            document.getElementById('tabInstall').classList.remove('active');
            
            const btnDel = document.getElementById('btnTabDelivery');
            const btnInst = document.getElementById('btnTabInstall');
            
            btnDel.classList.remove('active');
            btnInst.classList.remove('active');

            if (tabId === 'delivery') {
                document.getElementById('tabDelivery').classList.add('active');
                btnDel.classList.add('active');
            } else {
                document.getElementById('tabInstall').classList.add('active');
                btnInst.classList.add('active');
            }
            calculate();
        }

        // Nueva función para sumar/restar tallas independientes
        function changeSizeQty(id, amount) {
            const input = document.getElementById(id);
            let val = parseInt(input.value) + amount;
            if(val >= 0) {
                input.value = val;
                calculate();
            }
        }

        function calculate() {
            const lbl1 = document.getElementById('summaryLabel1');
            const val1 = document.getElementById('summaryValue1');
            const lbl2 = document.getElementById('summaryLabel2');
            const val2 = document.getElementById('summaryValue2');
            const total = document.getElementById('totalPrice');

            if (currentTab === 'delivery') {
                const zoneKey = document.getElementById('deliveryZone').value;
                const data = dbDelivery[zoneKey];

                lbl1.innerText = "Servicio";
                val1.innerText = "Delivery";
                lbl2.innerText = "Destino";
                val2.innerText = data.label;

                if (data.type === 'tbd') {
                    total.innerText = "A cotizar";
                    total.style.fontSize = "2.5rem";
                } else {
                    total.innerText = `${formatCurrency(data.min)} a ${formatCurrency(data.max)}`;
                    total.style.fontSize = "1.8rem";
                }
            } 
            else if (currentTab === 'install') {
                const zoneKey = document.getElementById('installZone').value;
                const data = dbInstall[zoneKey];

                const qS = parseInt(document.getElementById('qtySmall').value);
                const qM = parseInt(document.getElementById('qtyMedium').value);
                const qG = parseInt(document.getElementById('qtyLarge').value);
                const totalQty = qS + qM + qG;

                lbl1.innerText = "Servicio";
                val1.innerText = totalQty > 0 ? `Instalación (${totalQty})` : "Instalación";
                lbl2.innerText = "Ubicación";
                val2.innerText = data.label;

                let finalPrice = 0;

                if (totalQty === 0) {
                    total.innerText = "$0";
                } else {
                    if (zoneKey === 'miami_sitio' || zoneKey === 'fuera_miami') {
                        finalPrice = (qS * data.prices.pequeno) + (qM * data.prices.mediano) + (qG * data.prices.grande);
                    } 
                    else if (zoneKey === 'miami_local') {
                        // Cobra la "primera" (desplazamiento) a la obra más grande que haya en la lista
                        if (qG > 0) {
                            finalPrice = data.primera.grande + ((qG - 1) * data.extra.grande) + (qM * data.extra.mediano) + (qS * data.extra.pequeno);
                        } else if (qM > 0) {
                            finalPrice = data.primera.mediano + ((qM - 1) * data.extra.mediano) + (qS * data.extra.pequeno);
                        } else if (qS > 0) {
                            finalPrice = data.primera.pequeno + ((qS - 1) * data.extra.pequeno);
                        }
                    }
                    total.innerText = formatCurrency(finalPrice);
                }
                
                total.style.fontSize = totalQty > 0 ? "2.8rem" : "2.5rem";
            }
        }

        function contactarWhatsApp() {
            let mensaje = "";
            const total = document.getElementById('totalPrice').innerText;
            const numeroWhatsApp = "17864262444";

            if (currentTab === 'delivery') {
                const sel = document.getElementById('deliveryZone');
                const destino = sel.options[sel.selectedIndex].text;
                mensaje = `Hola Ramos Delivery! 🚚\nBusco cotizar un servicio de *Delivery*.\n\n📍 Destino: ${destino}\n💰 Estimado: ${total}\n\n¿Me ayudas con más detalles?`;
            } else {
                const sel = document.getElementById('installZone');
                const zona = sel.options[sel.selectedIndex].text;
                
                const qS = parseInt(document.getElementById('qtySmall').value);
                const qM = parseInt(document.getElementById('qtyMedium').value);
                const qG = parseInt(document.getElementById('qtyLarge').value);
                
                let sizesText = [];
                if(qG > 0) sizesText.push(`${qG} Grande(s)`);
                if(qM > 0) sizesText.push(`${qM} Mediano(s)`);
                if(qS > 0) sizesText.push(`${qS} Pequeño(s)`);
                let obrasInfo = sizesText.length > 0 ? sizesText.join(", ") : "Ninguna";

                mensaje = `Hola Ramos Delivery! 🖼️\nBusco cotizar una *Instalación de Arte*.\n\n📍 Ubicación: ${zona}\n📦 Obras: ${obrasInfo}\n💰 Estimado web: ${total}\n\n¿Podemos agendar?`;
            }

            const url = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        calculate();
    </script>
</body>
</html>
